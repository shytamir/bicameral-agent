[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bicameral-agent"
version = "0.1.0"
description = "Bounded continuity pilot with explicit owner controls, local Ollama integration and offline conformance tests"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
model-preparation = ["tokenizers==0.23.3"]

[tool.setuptools.packages.find]
include = ["bicameral_agent*"]
